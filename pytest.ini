[pytest]
# Configuration pour pytest

# Répertoire des tests
python_files = tests/test_*.py

# Options par défaut
addopts = -v --tb=short

# Ignorer les warnings
filterwarnings = ignore::DeprecationWarning

# Couverture de code (si pytest-cov est installé)
# Exécuter avec : pytest --cov=app --cov-report=term-missing
